<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // Fija el tema antes del primer pintado para evitar parpadeo.
      // Por defecto: oscuro.
      try {
        var __t = localStorage.getItem("edualex-theme") || "dark";
        if (__t !== "light") __t = "dark";
        document.documentElement.dataset.theme = __t;
        if (__t === "light") {
          document.querySelector('meta[name="theme-color"]').content = "#f6f5f1";
        }
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>EduAlex • Enlaces</title>
    <meta
      name="description"
      content="Todos los enlaces a recursos, plataformas y herramientas digitales de EduAlex para potenciar la educación media en Uruguay."
    />
    <meta name="author" content="alexcuadro" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://edualex.uy/" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preload" href="/icono-v2.png" as="image" crossorigin="anonymous" />
    <meta property="og:locale" content="es_UY" />
    <meta property="og:type" content="website" />

      property="og:description"
